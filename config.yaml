# RAVE configuration.
# Works out of the box against a local Ollama server (OpenAI-compatible /v1).
# For hosted APIs set llm.mode: api with a base_url; the wire protocol is
# auto-detected from the URL (api.anthropic.com vs OpenAI-compatible).

llm:
  # One model serves all four agent roles.
  # mode local: keyless; base_url defaults to http://localhost:11434/v1, so a
  #   local Ollama server hosting any model (llama, qwen, deepseek-r1, ...)
  #   works out of the box — just set `model` to what you pulled.
  # mode api: set base_url and put the key in the env var named api_key_env.
  #   The wire protocol is auto-detected: api.anthropic.com speaks the
  #   Anthropic protocol; every other URL speaks OpenAI-compatible /v1.
  mode: local                 # local | api
  base_url: ""                # empty in local mode = http://localhost:11434/v1
  model: llama3.1:8b
  api_key_env: RAVE_LLM_API_KEY   # api mode only: NAME of the env var holding the key
  timeout_seconds: 120
  max_tokens: 4096
  temperature: 0.2

search:
  # Backend selection:
  #   "metasearch" — self-hosted SearXNG/metasearch instance [recommended]:
  #                  Google + Bing reach and ~200 engines, with
  #                  community-maintained engine adapters;
  #   "scout"      — built-in keyless multi-source search (zero-install
  #                  fallback; no server, no Docker, no API key);
  #   "commercial" — keyed JSON search API (key in the named env var);
  #   "crawler"    — local BM25 index over a user-supplied domain list.
  # If backend is "auto": metasearch when a SearXNG answers (at metasearch_url,
  # or at localhost:8080 when none is configured), else commercial if its key
  # is present, else scout (always available).
  backend: auto               # auto | metasearch | scout | crawler | commercial
  scout:
    trusted_outlets: []       # domains marked trusted (a vetting quality boost)
    sources: {}               # per-source overrides, e.g. {startpage: false}
    searxng_public: false     # off by default; volunteer public SearXNG instances
    offline: false            # fixture-only mode (tests / smoke checks)
  metasearch_url: ""          # e.g. http://localhost:8080 (self-hosted, keyless)
  commercial:
    endpoint: ""              # JSON search API endpoint
    api_key_env: RAVE_SEARCH_API_KEY
  crawler:
    domains: []               # e.g. ["docs.example.com"]
    index_dir: .rave_index
    max_pages_per_domain: 50

pipeline:
  chunk_tokens: 400           # target chunk size (approx. tokens)
  chunk_overlap: 50           # approx. token overlap between chunks
  stale_months: 6             # staleness threshold for fast-moving topics
  max_fetch_per_search: 5     # pages fetched per web_search call
  embeddings:
    provider: hash            # hash (built-in, no external calls) | local
    base_url: ""              # OpenAI-compatible /v1 for provider: local
    model: ""

modes:
  speed:    {researcher_iters: 2, critic_cycles: 0, tool_call_ceiling: 25}
  balanced: {researcher_iters: 4, critic_cycles: 1, tool_call_ceiling: 60}
  quality:  {researcher_iters: 8, critic_cycles: 3, tool_call_ceiling: 150}
